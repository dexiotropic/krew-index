apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: env
spec:
  version: "v0.4.0"
  homepage: https://github.com/dexiotropic/kubenv
  shortDescription: Strict manifest variable substitution
  description: |
    kubenv renders Kubernetes manifests with strict {{ env.NAME }} substitution
    and exposes the same renderer as the kubectl env plugin.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.4.0/kubenv_kubectl-env_0.4.0_linux_amd64.tar.gz
    sha256: ab4e6561c7a40cb126cb963ce0c0f42e0bdd80d8d36595d9aa4bdf66297eb241
    bin: kubectl-env
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.4.0/kubenv_kubectl-env_0.4.0_linux_arm64.tar.gz
    sha256: cc216ad262b84b2c6d2206a42f8ce43551d934ec61e862d78ba1d73024669dc6
    bin: kubectl-env
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.4.0/kubenv_kubectl-env_0.4.0_darwin_amd64.tar.gz
    sha256: 8c1e8ab4da246c7925dc58f2e7b3e35ff3bf57b352511fbcf0c330b9be24c7a1
    bin: kubectl-env
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.4.0/kubenv_kubectl-env_0.4.0_darwin_arm64.tar.gz
    sha256: c25d0f33a9d377f92704e0c762bfd7ed32fde832880fe05b066ab6bbbb5b1fe9
    bin: kubectl-env
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.4.0/kubenv_kubectl-env_0.4.0_windows_amd64.zip
    sha256: e9be40569a593131386b3ebdb66535d0d968cab36674d4fcc84e09deece58e83
    bin: kubectl-env.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.4.0/kubenv_kubectl-env_0.4.0_windows_arm64.zip
    sha256: 011e4e59c955239856ec4a36f33d7bd55fb34dfb31e6b37f4bb633828035668a
    bin: kubectl-env.exe
